<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in · PO Approvals</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="top"><a href="/">PEP Brands · PO Approvals</a></header>
  <main>
    <div class="card login-box">
      <h1>Log in</h1>
      <div id="msg"></div>
      <form id="form">
        <p><label for="login">Username or email</label><input id="login" autocomplete="username" required></p>
        <p><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></p>
        <button class="primary" type="submit">Log in</button>
      </form>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script>
    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg");
      try {
        await api("/api/login", { json: { login: document.getElementById("login").value, password: document.getElementById("password").value } });
        window.location.href = "/";
      } catch (err) { flash(msg, err.error); }
    };
  </script>
</body>
</html>
