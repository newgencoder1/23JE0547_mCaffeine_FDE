<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase orders · PO Approvals</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="top"><a href="/">PEP Brands · PO Approvals</a><div id="userbar"></div></header>
  <main>
    <div id="msg"></div>

    <section class="card" id="upload-card" hidden>
      <h2>Upload a purchase order</h2>
      <p class="muted small">PDF only, up to 5 MB. Digital PDFs are read automatically; scans open an empty form for you to fill in.</p>
      <form id="upload-form" class="actions">
        <input type="file" id="file" accept="application/pdf,.pdf" required style="max-width:360px">
        <button class="primary" type="submit" id="upload-btn">Upload and read</button>
      </form>
    </section>

    <section class="card">
      <div class="tabs" id="tabs"></div>
      <div id="list"></div>
    </section>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/index.js"></script>
</body>
</html>
