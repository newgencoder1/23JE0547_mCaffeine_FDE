<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Purchase order · PO Approvals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="top">
    <a href="/" class="brand"><span class="logo">PO</span><span>PEP Brands <em>PO Approvals</em></span></a>
    <div id="userbar"></div>
  </header>
  <main class="wide">
    <a href="/" class="back">← All purchase orders</a>
    <div id="banners"></div>

    <section class="card po-hero">
      <div class="po-hero-top">
        <div class="po-hero-id">
          <span class="eyebrow">Purchase order</span>
          <h1 id="title">Loading…</h1>
          <div class="meta" id="meta"></div>
        </div>
        <div class="po-hero-side">
          <div id="status"></div>
          <div class="hero-total"><span>PO total</span><strong id="hero-total">—</strong></div>
        </div>
      </div>
      <ol class="stepper" id="stepper"></ol>
    </section>

    <div class="po-layout">
      <div class="po-main">
        <section class="card">
          <div class="card-head"><h2>Details</h2><span class="small muted" id="edit-hint"></span></div>
          <div class="grid">
            <div class="field"><label for="po_number">PO number</label><input id="po_number" data-field="po_number"><div class="err-text" data-err="po_number"></div></div>
            <div class="field"><label for="po_date">PO date (DD-MM-YYYY)</label><input id="po_date" data-field="po_date" placeholder="15-11-2026"><div class="err-text" data-err="po_date"></div></div>
            <div class="field"><label for="vendor_name">Vendor name</label><input id="vendor_name" data-field="vendor_name"><div class="err-text" data-err="vendor_name"></div></div>
            <div class="field"><label for="total">PO total (₹)</label><input id="total" data-field="total" placeholder="1,24,500.00"><div class="err-text" data-err="total"></div></div>
          </div>
        </section>

        <section class="card">
          <div class="card-head"><h2>Line items</h2><span class="small muted" id="lines-count"></span></div>
          <div class="table-wrap">
            <table class="items">
              <thead><tr><th>#</th><th>SKU</th><th>Description</th><th class="num">Quantity</th><th class="num">Unit price (₹)</th><th class="num">Line total (₹)</th><th></th></tr></thead>
              <tbody id="lines"></tbody>
            </table>
          </div>
          <button id="add-line" type="button" class="add-line">+ Add line</button>
        </section>
      </div>

      <aside class="po-side">
        <section class="card" id="action-card">
          <h2>Actions</h2>
          <div id="owner-actions" class="stack" hidden>
            <button id="submit" class="primary block" type="button">Submit for approval</button>
            <button id="save" class="block" type="button">Save draft</button>
            <button id="discard" class="danger-link" type="button" hidden>Discard draft</button>
          </div>
          <div id="approver-actions" hidden>
            <div class="field">
              <label for="remark">Remark <span class="muted">(optional to approve, <strong>required</strong> to reject)</span></label>
              <textarea id="remark" rows="3" maxlength="1000" placeholder="e.g. Please confirm the vendor GST number"></textarea>
              <span class="err-text" data-err="reason"></span>
            </div>
            <div class="split">
              <button id="approve" class="approve" type="button">✓ Approve</button>
              <button id="reject" class="reject" type="button">✕ Reject</button>
            </div>
          </div>
          <div id="no-actions" class="locked-note" hidden></div>
        </section>

        <section class="card">
          <h2>Checks</h2>
          <ul class="checks" id="checks"></ul>
        </section>

        <section class="card">
          <h2>History</h2>
          <ol class="history" id="history"></ol>
        </section>
      </aside>
    </div>
  </main>
  <script src="/static/common.js"></script>
  <script src="/static/po.js"></script>
</body>
</html>
